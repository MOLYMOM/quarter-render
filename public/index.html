<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4분의 1 — 신들의 카드 전장</title>
<meta name="description" content="영문도 모른 채 태어나, 신들의 전장에 소환됩니다. 출신도 카드도 고를 수 없는 브라우저 카드 배틀 — 혼자 또는 방 코드로 친구와 2~4명이 함께.">
<meta property="og:type" content="website">
<meta property="og:title" content="4분의 1 — 신들의 카드 전장">
<meta property="og:description" content="영문도 모른 채 태어나, 신들의 전장에 소환됩니다. 방 코드로 친구와 함께하는 카드 배틀.">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0f0e0d">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#0f0e0d;--ink:#ece6da;--mute:#8a847a;--line:#2d2a26;--red:#ff5a4e;--card:#191816;--blue:#6aa5e0;color-scheme:dark}
#fxc{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:20}
#fxflash{position:fixed;inset:0;pointer-events:none;z-index:19;opacity:0}
#fxflash.on{animation:flash .75s ease-out}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}
#fxword{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:21;opacity:0}
#fxword b{font-size:min(36vw,300px);font-weight:800;line-height:1;letter-spacing:-.04em}
#fxword small{font-family:'IBM Plex Mono',monospace;font-size:clamp(14px,2.4vw,22px);letter-spacing:.3em;margin-top:10px;opacity:.85}
#fxword.on{animation:word .95s ease-out}
@keyframes word{0%{opacity:0;transform:scale(1.7)}14%{opacity:.95;transform:scale(1)}70%{opacity:.7}100%{opacity:0;transform:scale(.9)}}
body.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-9px,4px)}30%{transform:translate(8px,-6px)}45%{transform:translate(-6px,-3px)}60%{transform:translate(5px,5px)}80%{transform:translate(-3px,1px)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
input{font:inherit;background:transparent;color:var(--ink);border:1px solid var(--line);padding:9px 12px;font-size:14px;border-radius:0;outline:none}
input:focus{border-color:var(--ink)}
#nick{width:150px}#code{width:104px;font-family:'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase}
.entry{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.or{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.25em;color:var(--mute);margin:28px 0 8px}
.note{font-size:12.5px;color:var(--mute);max-width:420px;line-height:1.7;margin:12px auto 0;min-height:1.7em}
.code{font-family:'IBM Plex Mono',monospace;font-size:clamp(44px,10vw,64px);font-weight:600;letter-spacing:.18em;margin:6px 0 4px}
.plist{list-style:none;padding:0;margin:14px 0;border-top:1px solid var(--line)}
.plist li{padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.sub{font-family:'IBM Plex Mono',monospace;font-weight:400;color:var(--mute);font-size:12px}
.sub2{color:var(--mute);font-size:13.5px;line-height:1.7}

body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Serif KR',serif;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',monospace}
button{font:inherit;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 16px;font-size:14px;border-radius:0}
button.ghost{background:transparent;color:var(--ink)}
button:disabled{opacity:.3;cursor:default}
#intro{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
.big{font-size:clamp(72px,16vw,150px);font-weight:800;letter-spacing:-.05em;line-height:1;font-family:'IBM Plex Mono',monospace}
.big span{color:var(--mute);font-weight:400}
.lede{max-width:440px;line-height:1.9;color:#b9b2a5;margin:28px 0 32px;font-size:15px}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px;gap:10px}
header h1{font-size:18px;margin:0;font-weight:800}
header .r{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--mute)}
header .tools{display:flex;gap:6px}
header .tools button{padding:4px 10px;font-size:12px}
#opps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.pl{border:1px solid var(--line);background:var(--card);padding:10px 12px;position:relative;transition:background .15s}
.pl.turn{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink),0 0 24px rgba(236,230,218,.12)}
.pl.dead{opacity:.4}
.pl.targetable{cursor:crosshair;border-color:var(--red);border-style:dashed}
.pl.targetable:hover{background:rgba(255,90,78,.1)}
.pl.hit{animation:hit .4s}
@keyframes hit{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.nm{font-weight:700;font-size:15px}
.ct{font-size:11.5px;color:var(--mute);margin-bottom:4px}
.hpr{display:flex;align-items:baseline;gap:6px}
.hp{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600}
.hp small{font-size:12px;color:var(--mute);font-weight:400}
.bar{height:3px;background:var(--line);margin:3px 0 6px}.bar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.bar.low i{background:var(--red)}
.stats{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap}
.tag{font-size:11px;border:1px solid var(--red);color:var(--red);padding:0 5px;margin-left:4px;font-weight:400}
#log{height:30vh;min-height:180px;overflow-y:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 2px;font-size:14px;line-height:1.75}
.ln .rr{font-family:'IBM Plex Mono',monospace;color:var(--mute);font-size:11px;display:inline-block;width:34px}
.ln.turn{margin-top:8px;color:var(--mute);font-size:12.5px}
.ln.atk{font-weight:600}
.ln.dmg{color:var(--red)}
.ln.good{color:#79c46c}
.ln.fate{background:#24211c;border-left:2px solid #e0b94a;padding:3px 8px;margin:6px 0}
.ln.death{font-weight:800;color:var(--red)}
#me{margin-top:12px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
#me .pl{min-width:260px}
#actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0;min-height:42px}
.hint{color:var(--mute);font-size:14px;margin-right:auto}
#hand{display:flex;gap:8px;flex-wrap:wrap;padding-top:8px}
.cd{width:108px;min-height:150px;background:var(--card);border:1px solid var(--line);padding:8px 8px 6px;display:flex;flex-direction:column;cursor:pointer;transition:transform .12s;position:relative;user-select:none}
.cd:hover{transform:translateY(-3px)}
.cd.sel{outline:2px solid var(--ink);transform:translateY(-8px)}
.cd.t-weapon{border-top:3px solid #e5534b}.cd.t-armor{border-top:3px solid #8796a8}
.cd.t-miracle{border-top:3px solid #9b7fd4}.cd.t-item{border-top:3px solid #5fae55}.cd.t-boost{border-top:3px solid #e0a040}
.cd.boosted{outline:2px dashed #e0a040;transform:translateY(-6px)}
.skl{font-size:11.5px;color:#e0b94a;margin:-2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.skl span{color:var(--mute)}
.doro{color:#ff8fc7}
.ln.doro{color:#ff9fd0;background:rgba(255,143,199,.08);padding:3px 8px;margin:6px 0;border-left:2px solid #ff8fc7}
.cd .ty{font-size:10px;letter-spacing:.08em;color:var(--mute)}
.cd .cn{font-weight:700;font-size:14px;margin-top:2px;line-height:1.3}
.cd .el{font-size:11px}
.cd .ds{font-size:10.5px;color:var(--mute);line-height:1.4;margin-top:3px}
.cd .cv{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:600;margin-top:auto}
.cd .cv small{font-size:12px;color:var(--mute);font-weight:400}
.cd .pr{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--mute);border-top:1px dashed var(--line);margin-top:4px;padding-top:3px}
.cd .mp{position:absolute;top:7px;right:8px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--blue)}
.cd.off{opacity:.45}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{background:var(--paper);max-width:600px;width:100%;padding:24px 26px;border:1px solid var(--ink);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheet h2{margin:4px 0 10px;font-size:22px}
.sheet .ty{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.15em;color:var(--mute)}
.sheet p{line-height:1.8}
.doc{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;margin:14px 0;font-size:14.5px}
.doc dt{color:var(--mute)}
.doc dd{margin:0}
.dhand{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:8px 0;cursor:pointer}
.others{font-size:13.5px;line-height:1.9;color:#b9b2a5}
.rules li{margin-bottom:6px;line-height:1.7;font-size:14px}
@media(max-width:680px){
 #opps{gap:6px}.pl{padding:7px 8px}.hp{font-size:20px}.nm{font-size:13.5px}
 .cd{width:calc(33.3% - 6px);min-height:138px}
 .stats{gap:6px;font-size:10.5px}
 .doc{grid-template-columns:96px 1fr}
}
</style>
</head>
<body>

<div id="intro">
  <div class="big">1<span>/</span>4</div>
  <p class="lede">영문도 모른 채 태어나,<br>신들의 전장에 소환됩니다.<br><br>출신도, 손에 쥔 카드도 고를 수 없습니다.<br>끝까지 서 있는 사람은 단 한 명.</p>
  <div class="entry"><input id="nick" maxlength="10" placeholder="닉네임" aria-label="닉네임"><button id="btnSolo">혼자 하기</button></div>
  <div class="or">함께 하기</div>
  <div class="entry"><button class="ghost" id="btnHost" disabled>방 만들기</button><input id="code" maxlength="4" placeholder="방 코드" aria-label="방 코드" autocomplete="off"><button class="ghost" id="btnJoin" disabled>참가</button></div>
  <p class="note" id="mpNote">연결을 확인하는 중…</p>
</div>

<div id="game" class="wrap" hidden>
  <header>
    <h1>4분의 1 <span class="mono" style="font-weight:400;color:var(--mute);font-size:13px">신들의 카드 전장</span></h1>
    <div class="tools"><span class="r" id="round"></span><button class="ghost" id="btnSound">소리 켜짐</button><button class="ghost" id="btnSpeed">속도 1×</button><button class="ghost" id="btnRules">규칙</button></div>
  </header>
  <section id="opps"></section>
  <section id="log"></section>
  <section id="me"></section>
  <section id="actions"></section>
  <section id="hand"></section>
</div>

<div id="fxflash"></div><canvas id="fxc"></canvas><div id="fxword"><b></b><small></small></div>
<div id="modal" hidden><div class="sheet" id="mb"></div></div>

<script>
const $=s=>document.querySelector(s);
const EL={none:'무',fire:'불',water:'물',wood:'나무',earth:'흙',light:'빛',dark:'어둠',wealth:'재물',plague:'역병'};

const COUNTRIES=[

function tone(f,d,type='sine',vol=.15,when=0,f2){const a=AC,t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,vol=.2,ftype='lowpass',f1=2000,f2,when=0,q=1){const a=AC,t=a.currentTime+when,n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
 const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=b;fl.type=ftype;fl.Q.value=q;fl.frequency.setValueAtTime(f1,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(a.destination);s.start(t)}

 }}catch(e){}

/* ---------- core rules (host / solo) ---------- */
const SPECIAL=new Set(['curse','swap','mpsteal','stop']);
const SPFX={curse:'dark',swap:'light',mpsteal:'water',stop:'light'};
const sk=p=>p&&p.sk;
const price=p=>sk(p)==='goldrush'?5:BUY;
function healP(p,n){if(sk(p)==='sakura')n=Math.ceil(n*1.5);p.hp=Math.min(p.maxhp,p.hp+n)}
function giveDis(p,k){if(!p||!p.alive)return;if(sk(p)==='amazon'){log(`${p.name} · 아마존의 생명력 — ${DIS[k].n}에 걸리지 않았다`,'good');return}p.dis=k;p.disT=DIS[k].t;log(`${p.name} · ${DIS[k].n}에 걸렸다`,'dmg')}
function take(p,uid){const i=p.hand.findIndex(x=>x.uid===uid);return i<0?null:p.hand.splice(i,1)[0]}
function armorVal(a,el,pierce){let v;if(el==='dark')v=a.el==='light'?a.v:0;else if(COUNTER[el]&&COUNTER[el]===a.el)v=a.v*2;else v=a.v;return pierce?Math.floor(v/2):v}
function blockVal(t,a,atk){const v=armorVal(a,atk.el,atk.pierce);return v>0&&sk(t)==='wall'?v+1:v}
function dmg(p,n,src,cause,opt={}){
 if(!p.alive||n<=0)return;
 p.hp-=n;p.taken+=n;if(src&&src!==p)src.dealt+=n;
 render();flash(p);
 if(p.hp<=0||opt.kill){
  if(sk(p)==='pyramid'&&!p.usedPyr){p.usedPyr=1;p.hp=1;log(`${p.name} · 피라미드의 가호 — HP 1로 버텼다!`,'good');render();return}
  p.hp=0;p.alive=false;p.deathRound=G.round;p.cause=cause;p.rank=alive().length+1;
  if(src&&src!==p)src.kills++;
  log(`✝ ${p.name} 쓰러짐 — ${cause}`,'death');
  if(sk(p)==='muertos'&&src&&src!==p&&src.alive){log(`${p.name} · 죽은 자의 날 — ${src.name}에게 8 피해`,'dmg');dmg(src,8,p,`${p.name}의 죽은 자의 날`)}
  checkEnd();
 }
}
function checkEnd(){
 if(G.over)return;
 const al=alive();
 if(al.length<=1||!al.some(p=>p.ctl!=='ai')){
  G.over=true;if(al.length===1)al[0].rank=1;
  render();if(G.mode==='host')netSend({t:'st',s:snap()});
  setTimeout(showRecord,900/speed);
 }
}
function fxAll(el,o){fx(el,o);if(G&&G.mode==='host')netSend({t:'fx',el,o})}
function buildAtk(att,c,bs){
 let v=c.v+bs.reduce((s,b)=>s+(b.v||0),0);const el=c.el||'none';
 if(c.t==='weapon'&&sk(att)==='engineering')v+=2;
 const eb={niger:'water',volcano:'fire',rainforest:'wood',k2:'earth'}[sk(att)];
 if(eb&&eb===el&&v>0)v+=3;
 return {n:c.n+(bs.length?' + '+bs.map(b=>b.n).join(' + '):''),v,el,fx:c.fx||'hit',all:!!c.all,
  pierce:!!(c.pierce||bs.some(b=>b.pierce)),poison:!!(c.poison||bs.some(b=>b.poison)),double:!!(c.double||bs.some(b=>b.double)),drain:!!c.drain,self:c.self||0};
}
async function playAttack(att,x,targets,boostUids=[]){
 const c=C[x.k];take(att,x.uid);if(c.mp)att.mp-=c.mp;
 const bs=boostUids.map(u=>take(att,u)).filter(Boolean).map(b=>C[b.k]);
 const atk=buildAtk(att,c,bs),sp=SPECIAL.has(atk.fx);
 log(`${att.name} ▸ ${atk.n}${!sp&&atk.v?` (${atk.v}${atk.el!=='none'?' '+EL[atk.el]:''})`:''} ${targets.length>1?'→ 모든 적':'→ '+targets[0].name}`,'atk');
 fxAll(sp?SPFX[atk.fx]:atk.el,{all:atk.all,big:atk.v>=10||atk.el==='plague',name:c.n});
 render();await sleep(900);
 if(atk.self&&att.alive){log(`${att.name} · ${c.n}의 저주로 ${atk.self} 피해`,'dmg');dmg(att,atk.self,null,`${c.n}의 저주`)}
 for(const t of targets){
  for(let hit=0;hit<(atk.double?2:1);hit++){
   if(!t.alive||G.over||!att.alive)break;
   if(hit)log(`${att.name} · 한 번 더!`,'atk');
   await strike(att,t,atk);
  }
 }
}
async function strike(att,t,atk){
 const sp=SPECIAL.has(atk.fx);
 if(!sp&&sk(t)==='islands'&&Math.random()<.15){log(`${t.name} · 7천 개의 섬 — 공격을 피했다!`,'good');await sleep(300);return}
 const def=await defend(t,att,atk);
 if(G.over||!t.alive)return;
 if(sp){
  let src=att,tgt=t;
  if(def.reflect){useReflect(t);fxAll('dark',{name:'반사'});
   if(atk.fx==='swap'){log(`${t.name} · 반사! 생명 교환을 튕겨냈다`,'good');return}
   log(`${t.name} · 반사! ${atk.n}이(가) ${att.name}에게 되돌아간다`,'good');src=t;tgt=att}
  applySpecial(atk,src,tgt);render();await sleep(350);return;
 }
 if(def.reflect){
  useReflect(t);fxAll(atk.el,{name:'반사'});await sleep(500);
  log(`${t.name} · 반사! ${atk.n}이(가) ${att.name}에게 되돌아간다`,'good');
  hitWith(t,att,atk,atk.v,`${t.name}가 되돌린 ${atk.n}`);render();await sleep(400);return;
 }
 let block=0,thorn=0;const used=[];
 for(const u of def.cards){const a=take(t,u);if(a){block+=blockVal(t,C[a.k],atk);thorn+=C[a.k].thorn||0;used.push(C[a.k].n)}}
 let d=Math.max(0,atk.v-block);
 if(d>0&&sk(t)==='delta'&&(atk.el==='water'||atk.el==='earth'))d=Math.max(0,d-2);
 log(`${t.name} — ${used.length?used.join('+')+'로 '+block+' 방어 · ':''}${atk.el==='wealth'?'뚫림 ':'피해 '}${d}`,d?'dmg':'');
 hitWith(att,t,atk,d,`${att.name}의 ${atk.n}`);
 if(thorn&&att.alive&&!G.over){log(`${t.name}의 가시 갑옷 — ${att.name}에게 ${thorn} 피해`,'dmg');dmg(att,thorn,t,`${t.name}의 가시 갑옷`)}
 render();await sleep(400);
}
function hitWith(src,t,atk,d,cause){
 if(d<=0||!t.alive)return;
 if(atk.el==='wealth'){const g=Math.min(d,t.g);t.g-=g;src.g+=g;log(`${src.name} · ${t.name}에게서 ${g}G 약탈`,g?'good':'');if(g)fxAll('wealth',{name:g+'G 약탈'});return}
 if(atk.el==='plague'){log(`${t.name} · 역병에 닿았다 — 즉사`,'death');dmg(t,d,src,`${src.name}의 ${atk.n} (역병)`,{kill:true});return}
 dmg(t,d,src,cause);
 if(atk.poison&&t.alive)giveDis(t,'cold');
 if(atk.drain&&src.alive){healP(src,d);log(`${src.name} · HP ${d} 흡수`,'good')}
}
function applySpecial(atk,src,tgt){
 if(atk.fx==='curse')giveDis(tgt,'fever');
 if(atk.fx==='swap'){const a=src.hp;src.hp=Math.min(src.maxhp,tgt.hp);tgt.hp=Math.min(tgt.maxhp,a);log(`${src.name} ⇄ ${tgt.name} · HP 교환 (${src.hp} / ${tgt.hp})`,'atk')}
 if(atk.fx==='mpsteal'){const n=Math.min(atk.v,tgt.mp);tgt.mp-=n;src.mp=Math.min(MAXMP,src.mp+n);log(`${src.name} · ${tgt.name}의 MP ${n} 강탈`,'good')}
 if(atk.fx==='stop'){tgt.stun=1;log(`${tgt.name} · 시간이 멈췄다 — 다음 차례를 쉰다`,'dmg')}
}
function useReflect(p){const r=p.hand.find(x=>x.k==='reflect');if(r){take(p,r.uid);p.mp-=C.reflect.mp}}
function castSelf(p,x){
 const c=C[x.k];take(p,x.uid);p.mp-=c.mp||0;
 if(c.fx==='heal'){healP(p,c.v);log(`${p.name} ▸ ${c.n} · HP 회복`,'good')}
 if(c.fx==='cure'){p.dis=null;p.disT=0;log(`${p.name} ▸ ${c.n} · 병이 나았다`,'good')}
 render();
}
function useItem(p,x,target){
 const c=C[x.k];take(p,x.uid);
 if(c.fx==='hp'){healP(p,c.v);log(`${p.name} · ${c.n} · HP 회복`,'good')}
 if(c.fx==='mp'){p.mp=Math.min(MAXMP,p.mp+c.v);log(`${p.name} · ${c.n} · MP +${c.v}`,'good')}
 if(c.fx==='g'){p.g+=c.v;log(`${p.name} · ${c.n} · +${c.v}G`)}
 if(c.fx==='cure'){p.dis=null;p.disT=0;log(`${p.name} · ${c.n} · 병이 나았다`,'good')}
 if(c.fx==='chest'){draw(p,c.v);log(`${p.name} · ${c.n} · 카드 ${c.v}장`,'good')}
 if(c.fx==='pick'&&target){
  if(target.hand.length&&p.hand.length<HANDMAX){const k=target.hand.splice(Math.floor(Math.random()*target.hand.length),1)[0];p.hand.push(k);log(`${p.name} · 도둑 장갑으로 ${target.name}의 카드 1장을 훔쳤다`,'atk')}
  else log(`${p.name} · 도둑 장갑 — 훔칠 것이 없었다`);
 }
 if(c.fx==='lotto'){
  if(Math.random()<.125){p.hp=p.maxhp;p.mp=MAXMP;p.luck++;log(`${p.name} · 복권 당첨! 8분의 1의 확률 — HP·MP 완전 회복`,'good')}
  else log(`${p.name} · 복권 꽝 (87.5%)`);
 }
 render();
}
function buy(p){const pr=price(p);if(p.g<pr||p.hand.length>=HANDMAX)return;p.g-=pr;draw(p);log(`${p.name} · ${pr}G로 카드 한 장을 샀다`);render()}
function pray(p){draw(p);log(`${p.name} · 기도하며 차례를 넘겼다`);render()}

/* ---------- defense ---------- */
function defOptions(t,atk){return {arms:SPECIAL.has(atk.fx)?[]:t.hand.filter(x=>C[x.k].t==='armor'),canRef:t.hand.some(x=>x.k==='reflect')&&t.mp>=C.reflect.mp}}
function aiDefense(t,atk){return SPECIAL.has(atk.fx)?{cards:[],reflect:aiReflectCurse(t)}:aiDefend(t,atk)}
function defend(t,att,atk){
 if(t.ctl==='local')return askDefense(t,att,atk);
 if(t.ctl==='remote')return remoteDefense(t,att,atk);
 return Promise.resolve(aiDefense(t,atk));
}
function askDefense(t,att,c){
 const sp=SPECIAL.has(c.fx);
 const {arms,canRef}=defOptions(t,c);
 if(!arms.length&&!canRef)return Promise.resolve({cards:[],reflect:false});
 return new Promise(res=>{
  const pick=new Set();let useRef=false;
  const paint=()=>{
   let block=0;pick.forEach(u=>{const x=t.hand.find(h=>h.uid===u);if(x)block+=blockVal(t,C[x.k],c)});
   const d=Math.max(0,c.v-block);
   const warn=c.el==='plague'?' — <b style="color:#a3d900">1 피해라도 받으면 즉사!</b>':c.el==='wealth'?' — 뚫린 만큼 골드를 빼앗깁니다':c.el==='dark'?' — 빛의 방어구만 효과가 있습니다':'';
   const outcome=useRef?(sp?'→ 되돌립니다':`→ ${esc(att.name)}에게 그대로 되돌립니다`):sp?'→ 그대로 받습니다':
    c.el==='plague'?(d?`방어 ${block} → <b style="color:var(--red);font-size:18px">즉사</b>`:`방어 ${block} → <b style="color:#79c46c">막아냄</b>`):
    `방어 ${block} → ${c.el==='wealth'?'빼앗길 골드':'받을 피해'} <b style="color:var(--red);font-size:18px">${d}</b>`;
   $('#mb').innerHTML=`<div class=ty>방어 · DEFENSE</div><h2>${esc(att.name)}의 ${esc(c.n)}</h2>
    <p>${sp?'당신을 노립니다. 반사로만 되돌릴 수 있습니다.':`공격력 <b class=mono>${c.v}</b> · ${EL[c.el]||'무'} 속성${c.pierce?' · 관통(방어 절반)':''}${c.all?' · 전체 공격':''}${warn}`}</p>

/* ---------- AI ---------- */
function aiDefend(t,atk){
 const canRef=t.hand.some(x=>x.k==='reflect')&&t.mp>=C.reflect.mp;
 if(canRef&&(atk.v>=8||atk.el==='plague'))return {reflect:true,cards:[]};
 if(atk.v<=3&&t.hp>20&&atk.el!=='plague')return {cards:[]};
 const arm=t.hand.filter(x=>C[x.k].t==='armor').map(x=>({uid:x.uid,v:blockVal(t,C[x.k],atk)})).filter(a=>a.v>0);
 const cover=arm.filter(a=>a.v>=atk.v).sort((a,b)=>a.v-b.v)[0];
 if(cover)return {cards:[cover.uid]};
 arm.sort((a,b)=>b.v-a.v);let s=0;const pick=[];
 for(const a of arm){if(s>=atk.v)break;pick.push(a.uid);s+=a.v}
 return {cards:pick};
}
function aiReflectCurse(t){return t.hand.some(x=>x.k==='reflect')&&t.mp>=C.reflect.mp&&Math.random()<.6}
async function aiTurn(p){
 await sleep(550);
 const foes=()=>alive().filter(q=>q!==p);
 for(const x of [...p.hand]){
  const c=C[x.k];if(c.t!=='item'||!p.hand.includes(x))continue;
  if(c.fx==='g'||c.fx==='lotto'||(c.fx==='chest'&&p.hand.length<=HANDMAX-2)||(c.fx==='hp'&&p.hp<=p.maxhp-12)||(c.fx==='mp'&&p.mp<=MAXMP-c.v)||(c.fx==='cure'&&p.dis)){useItem(p,x);await sleep(350)}
  else if(c.fx==='pick'&&p.hand.length<HANDMAX){const f=foes().sort((a,b)=>b.hand.length-a.hand.length)[0];if(f&&f.hand.length){useItem(p,x,f);await sleep(350)}}
 }
 if(p.g>=price(p)&&p.hand.length<7){buy(p);await sleep(300)}
 const find=fx=>p.hand.filter(x=>C[x.k].fx===fx&&usable(p,x));
 if(p.dis==='fever'&&p.hp<=24){const pu=find('cure')[0];if(pu){castSelf(p,pu);return}}
 if(p.hp<=18){const h=find('heal').sort((a,b)=>C[b.k].v-C[a.k].v)[0];if(h){castSelf(p,h);return}}
 const fs=foes();if(!fs.length){pray(p);return}
 const boosts=p.hand.filter(x=>C[x.k].t==='boost');
 const opts=p.hand.filter(x=>isAtk(C[x.k])&&usable(p,x)).map(x=>{
  const c=C[x.k];let s,tg=null;
  if(c.fx==='swap'){const f=[...fs].sort((a,b)=>b.hp-a.hp)[0];s=(f.hp-p.hp)>=12?f.hp-p.hp:-99;tg=[f]}
  else if(c.fx==='mpsteal'){const f=[...fs].sort((a,b)=>b.mp-a.mp)[0];s=Math.min(c.v,f.mp)*.4;tg=[f]}
  else if(c.fx==='stop'){tg=[rnd(fs)];s=5}
  else if(c.fx==='curse'){const ok=fs.filter(f=>!f.dis);tg=[rnd(ok.length?ok:fs)];s=5}
  else if(c.el==='wealth'){if(c.all){tg=fs;s=fs.reduce((a,f)=>a+Math.min(c.v,f.g),0)*.6}else{const f=[...fs].sort((a,b)=>b.g-a.g)[0];tg=[f];s=Math.min(c.v,f.g)*.7}}
  else{s=c.v*(c.all?fs.length*.75:1)+(c.el==='plague'?8:0);if(c.all)tg=fs}
  if(c.mp)s-=c.mp*.15;return {x,s:s+Math.random()*3,tg}}).sort((a,b)=>b.s-a.s);
 if(opts.length&&opts[0].s>0){
  const o=opts[0],c=C[o.x.k];let tg=o.tg;
  if(!tg){const sorted=[...fs].sort((a,b)=>a.hp-b.hp);tg=[Math.random()<.55?sorted[0]:rnd(fs)]}
  await playAttack(p,o.x,tg,c.t==='weapon'?boosts.map(b=>b.uid):[]);return;
 }
 const h=find('heal')[0];if(h&&p.hp<p.maxhp-8){castSelf(p,h);return}
 pray(p);
}

/* ---------- turn flow ---------- */
async function dororong(p){
 const r=Math.random(),n=3+Math.floor(Math.random()*6);
 if(r<.4){fxAll('petal',{name:'도로롱의 미소'});await sleep(500);healP(p,n);log(`승리의 여신 도로롱이 ${p.name}에게 미소 지었다 — HP +${n}`,'doro');render();await sleep(500)}
 else if(r<.7){fxAll('petal',{name:'도로롱의 변덕'});await sleep(500);log(`승리의 여신 도로롱의 변덕 — ${p.name}에게 ${n} 피해`,'doro');dmg(p,n,null,'도로롱의 변덕');await sleep(500)}
}
async function startTurn(p){
 G.active=p;log(`— ${p.name}의 차례`,'turn');render();
 if(p.dis){const d=DIS[p.dis];log(`${p.name} · ${d.n}로 ${d.dmg} 피해`,'dmg');dmg(p,d.dmg,null,d.n);p.disT--;
  if(p.alive&&p.disT<=0){log(`${p.name} · ${d.n}이 나았다`,'good');p.dis=null}
  await sleep(300);
 }
 if(p.alive&&!G.over&&G.doro>0)await dororong(p);
 if(!p.alive||G.over)return false;
 if(sk(p)==='ganges')p.hp=Math.min(p.maxhp,p.hp+1);
 if(sk(p)==='halong')p.mp=Math.min(MAXMP,p.mp+3);
 draw(p,(p.hand.length<=2?2:1)+(sk(p)==='hangang'?1:0));
 if(p.stun){p.stun=0;log(`${p.name} · 시간이 멈춰 이번 차례를 쉰다`,'turn');render();await sleep(500);return false}
 render();return true;
}
// no time limit on a human turn
function turnWait(){return new Promise(r=>{G.res=r;G.waiting=true;G.busy=false;SEL=null;BOOST.clear();render()})}
function endTurn(){G.waiting=false;G.busy=false;SEL=null;BOOST.clear();const r=G.res;G.res=null;render();r&&r()}
async function fate(){
 if(Math.random()>=FATE_CHANCE)return;
 let r=Math.random()*FTOT,f=FATE[0];for(const x of FATE){r-=x.w;if(r<=0){f=x;break}}
 const pr=(FATE_CHANCE*f.w/FTOT*100).toFixed(1);
 log(`운명 · ${f.n} — ${f.d}  (이번 라운드에 일어날 확률 ${pr}%)`,f.doro?'doro':'fate');
 G.fates.push(`${f.n} (${pr}%)`);
 f.f();render();await sleep(f.doro?1400:700);
}
async function loop(){
 const gid=G.id;
 while(G&&G.id===gid&&!G.over){
  const p=G.ps[G.cur];
  if(p.alive){
   const act=await startTurn(p);
   if(act&&p.alive&&!G.over){if(p.ctl==='ai')await aiTurn(p);else await turnWait(p)}
  }
  if(!G||G.id!==gid||G.over)break;
  G.cur=(G.cur+1)%G.ps.length;
  if(G.cur===G.start){
   G.round++;
   if(G.doro>0){G.doro--;if(!G.doro)log('승리의 여신 도로롱이 떠났다','doro')}
   await fate();
  }
 }
}
function validBoosts(p,c,arr){
 if(c.t!=='weapon'||!Array.isArray(arr))return [];
 return [...new Set(arr.slice(0,HANDMAX).map(num))].filter(u=>p.hand.some(x=>x.uid===u&&C[x.k].t==='boost'));
}
async function handleAct(seat,a){
 if(!G||G.over||!G.waiting||G.busy||seat!==G.cur||!a)return;
 const p=G.ps[seat];
 const x=a.uid!=null?p.hand.find(h=>h.uid===a.uid):null,c=x&&C[x.k];
 switch(a.a){
  case 'attack':{if(!x||!usable(p,x)||!isAtk(c)||c.all)return;const t=G.ps[a.target];if(!t||!t.alive||t===p)return;
   const bu=validBoosts(p,c,a.boosts);G.busy=true;render();await playAttack(p,x,[t],bu);endTurn();break}
  case 'attackAll':{if(!x||!usable(p,x)||!isAtk(c)||!c.all)return;const bu=validBoosts(p,c,a.boosts);
   G.busy=true;render();await playAttack(p,x,alive().filter(q=>q!==p),bu);endTurn();break}
  case 'cast':if(!x||!usable(p,x)||!(c.fx==='heal'||c.fx==='cure'))return;castSelf(p,x);endTurn();break;
  case 'item':{if(!x||c.t!=='item')return;
   if(c.target){const t=G.ps[a.target];if(!t||!t.alive||t===p)return;useItem(p,x,t)}else useItem(p,x);break}
  case 'discard':if(!x)return;take(p,x.uid);log(`${p.name} · ${c.n}을(를) 버렸다`);render();break;
  case 'buy':buy(p);break;
  case 'pray':pray(p);endTurn();break;
 }
}

 NET.lobby=false;$('#modal').hidden=false;
 $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(recordText());$('#cp').textContent='복사됨'}catch(e){$('#cp').textContent='복사 실패'}};
 $('#cl').onclick=()=>$('#modal').hidden=true;
 const rs=$('#rs');if(rs)rs.onclick=restart;
}
function restart(){
 if(!G||G.mode==='client')return;
 if(G.mode==='solo'){$('#modal').hidden=true;newGame({mode:'solo'});return}
 G=null;NET.r&&NET.r.presence({stage:'lobby'}).catch(()=>{});showLobby();
}

/* ---------- multiplayer (room) ---------- */
function netSend(m){if(NET.r)NET.r.emit('g',m).catch(()=>{})}
function snap(){return {id:G.id,st:G.start,r:G.round,o:G.over?1:0,a:G.ps.indexOf(G.active),w:G.waiting&&!G.busy?G.cur:-1,f:G.fates.slice(-6),dg:G.doro||0,
 ps:G.ps.map(p=>({n:p.name,c:p.country,cp:p.cpct,hp:p.hp,mp:p.mp,g:p.g,h:p.hand.map(x=>[x.uid,x.k]),d:p.dis,dt:p.disT,al:p.alive?1:0,dr:p.deathRound,ca:p.cause,rk:p.rank,pe:p.peer,ai:p.ctl==='ai'?1:0,dl:p.dealt,tk:p.taken,kl:p.kills,lu:p.luck,mh:p.maxhp,sn:p.stun?1:0}))}}
let syncT=null;
function sync(){if(!NET.r||!G||G.mode!=='host'||syncT)return;syncT=setTimeout(()=>{syncT=null;if(G&&G.mode==='host')netSend({t:'st',s:snap()})},120)}
setInterval(()=>{if(G&&G.mode==='host'&&NET.r)netSend({t:'st',s:snap()})},3000);
function applySnap(s){
 if(!s||typeof s!=='object'||!Array.isArray(s.ps))return;
 const ps=s.ps.slice(0,4).map(q=>({name:cleanNick(q.n)||'무명',real:'',country:str(q.c,20),cpct:num(q.cp),hp:num(q.hp),mp:num(q.mp),g:num(q.g),
  hand:(Array.isArray(q.h)?q.h:[]).filter(e=>Array.isArray(e)&&hasCard(e[1])).slice(0,12).map(e=>({uid:num(e[0]),k:e[1]})),
  dis:(q.d==='cold'||q.d==='fever')?q.d:null,disT:num(q.dt),alive:!!q.al,deathRound:num(q.dr),cause:str(q.ca,40),rank:num(q.rk),
  peer:str(q.pe,64),ctl:q.ai?'ai':'remote',dealt:num(q.dl),taken:num(q.tk),kills:num(q.kl),luck:num(q.lu),
  maxhp:Math.min(60,num(q.mh))||MAXHP,stun:q.sn?1:0,sk:(SKILLS[str(q.c,20)]||[''])[0]}));
 if(!ps.length)return;
 const id=str(s.id,12),fresh=!G||G.mode!=='client'||G.id!==id,wasOver=!fresh&&G.over;
 const me=ps.findIndex(p=>p.peer&&p.peer===NET.me),a=num(s.a);
 G={mode:'client',id,ps,me,start:num(s.st),round:num(s.r),over:!!s.o,active:ps[a]||null,cur:a,waiting:me>=0&&num(s.w)===me&&s.w!==-1,busy:false,fates:(Array.isArray(s.f)?s.f:[]).map(x=>str(x,40)).slice(0,10),doro:Math.min(30,num(s.dg))};
 if(fresh){$('#log').innerHTML='';showGameView();if(me>=0)showSheet(null);else $('#modal').hidden=true}
 render();
 if(G.over&&!wasOver)setTimeout(showRecord,900);
}
async function clientDefense(d){
 if(!G||G.mode!=='client')return;
 const id=str(d.id,12);
 if(NET.defAns&&NET.defAns.id===id){netSend(NET.defAns);return}
 if(NET.defId===id)return;
 const a=d.a&&typeof d.a==='object'?d.a:null,t=meP(),att=G.ps[num(d.att)];if(!t||!att||!a)return;
 const atk={n:str(a.n,60),v:num(a.v),el:Object.prototype.hasOwnProperty.call(EL,a.el)?a.el:'none',fx:(a.fx==='hit'||a.fx==='atk'||SPECIAL.has(a.fx))?a.fx:'hit',all:!!a.all,pierce:!!a.pierce};
 NET.defId=id;
 const r=await askDefense(t,att,atk);
 NET.defAns={t:'dr',id,cards:r.cards,reflect:r.reflect};netSend(NET.defAns);
}
function onMsg(msg){
 const d=msg.data;if(!d||typeof d!=='object')return;
 if(NET.host){
  if(!G||G.mode!=='host')return;
  if(d.t==='act'&&d.a&&typeof d.a==='object'){
   const seat=G.ps.findIndex(p=>p.ctl==='remote'&&p.peer===msg.peer);
   if(seat>=0)handleAct(seat,{a:str(d.a.a,12),uid:d.a.uid==null?null:num(d.a.uid),target:num(d.a.target),boosts:Array.isArray(d.a.boosts)?d.a.boosts.slice(0,HANDMAX).map(num):[]});
  }
  if(d.t==='dr')handleDr(msg);
  return;
 }
 if(!NET.hostId||msg.peer!==NET.hostId)return;
 if(d.t==='st')applySnap(d.s);
 else if(d.t==='lg'&&G&&G.mode==='client')logLine(str(d.x,200),['turn','atk','dmg','good','fate','death'].includes(d.c)?d.c:'',num(d.r));
 else if(d.t==='fx'&&G&&G.mode==='client'){const o=d.o&&typeof d.o==='object'?d.o:{};fx(FXC[d.el]&&Object.prototype.hasOwnProperty.call(FXC,d.el)?d.el:'none',{all:!!o.all,big:!!o.big,name:str(o.name,16)})}
 else if(d.t==='dq'&&d.to===NET.me)clientDefense(d);
}
function onPeersCh(ch){
 const mine=ch.peers.find(p=>p.sameTab);if(mine)NET.me=mine.peer;
 if(!NET.host){
  if(!NET.hostId){const h=ch.peers.find(p=>!p.sameTab&&p.presence&&p.presence.host);if(h)NET.hostId=h.peer}
  if(NET.hostId&&ch.left.some(p=>p.peer===NET.hostId)){hostGone();return}
  const h=ch.peers.find(p=>p.peer===NET.hostId);
  if(h&&h.presence&&h.presence.stage==='lobby'&&G&&G.mode==='client'){G=null;showLobby()}
 }else if(G&&G.mode==='host'){
  for(const l of ch.left){
   const seat=G.ps.findIndex(p=>p.ctl==='remote'&&p.peer===l.peer);if(seat<0)continue;
   const p=G.ps[seat];p.ctl='ai';
   if(!G.over)log(`${p.name} 연결 끊김 — 이제 AI가 대신 싸운다`,'turn');
   for(const id in G.pend)if(G.pend[id].seat===seat)G.pend[id].done(aiDefense(p,G.pend[id].c));
   if(!G.over&&G.res&&G.cur===seat&&!G.busy){G.busy=true;render();aiTurn(p).then(()=>{if(G&&G.mode==='host')endTurn()})}
   checkEnd();
  }
  sync();
 }
 if(NET.lobby)renderLobby();
}
function hostGone(){
 leaveRoom();G=null;
 $('#mb').innerHTML=`<div class=ty>연결 종료</div><h2>방장이 나갔어요</h2><p>방장 화면이 게임을 진행하기 때문에 이 방은 더 이어갈 수 없습니다.</p><div class=row><button id=hg>처음으로</button></div>`;
 $('#modal').hidden=false;$('#hg').onclick=resetToTitle;
}
function leaveRoom(){if(NET.r){NET.r.leave().catch(()=>{})}NET.r=null;NET.lobby=false;NET.hostId='';NET.host=false}
const CODECH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function genCode(){let s='';for(let i=0;i<4;i++)s+=CODECH[Math.floor(Math.random()*CODECH.length)];return s}
function setNote(t){$('#mpNote').textContent=t}
async function enterRoom(code,asHost){
 if(!NET.room)return;
 setNote('연결 중…');
 let r;try{r=await NET.room.join('q4-'+code.toLowerCase())}catch(e){setNote(`방에 들어갈 수 없어요 (${(e&&e.code)||'오류'})`);return}
 NET.r=r;NET.code=code;NET.host=asHost;NET.hostId='';NET.defId='';NET.defAns=null;
 r.on('g',onMsg,()=>{});r.onPeers(onPeersCh,()=>{});
 r.presence(asHost?{nick:NICK,host:1,stage:'lobby'}:{nick:NICK}).catch(()=>{});
 setNote('');showLobby();
 if(!asHost)setTimeout(()=>{if(NET.r===r&&!NET.hostId){leaveRoom();resetToTitle();setNote(`${code} 방을 찾을 수 없어요. 코드를 다시 확인해 주세요.`)}},5000);
}
function lobbyPeers(){return NET.r?NET.r.peers().filter(p=>p.kind==='viewer'):[]}
function showLobby(){NET.lobby=true;$('#modal').hidden=false;renderLobby()}
function renderLobby(){
 if(!NET.lobby||!NET.r)return;
 const ps=lobbyPeers(),n=ps.length,seated=Math.min(n,4);
 const list=ps.map((p,i)=>`<li><span class=mono style="color:var(--mute);margin-right:10px">${i<4?i+1:'관전'}</span>${esc(cleanNick(p.presence&&p.presence.nick)||'입장 중…')}${p.presence&&p.presence.host?' <span class=sub>방장</span>':''}${p.sameTab?' <span class=sub>(나)</span>':''}</li>`).join('');
 const canStart=seated>=2||(NET.fill&&seated>=1);
 $('#mb').innerHTML=`<div class=ty>대기실 · ROOM</div>
  <div class=code>${esc(NET.code)}</div>
  <p class=sub2>친구도 이 페이지를 열고 이 코드를 입력하면 들어옵니다. 2~4명이 함께 할 수 있어요.</p>
  <ul class=plist>${list||'<li class=sub2>연결 중…</li>'}</ul>
  ${NET.host?`<label class=chk><input type=checkbox id=aifill ${NET.fill?'checked':''}> 빈자리를 AI로 채워 4명으로 하기</label>`:'<p class=sub2>방장이 시작하기를 기다리는 중…</p>'}
  <div class=row><button class=ghost id=lbLeave>나가기</button>${NET.host?`<button id=lbStart ${canStart?'':'disabled'}>시작 · ${seated}명${NET.fill&&seated<4?` + AI ${4-seated}`:''}</button>`:''}</div>`;
 $('#lbLeave').onclick=()=>{leaveRoom();resetToTitle()};
 const af=$('#aifill');if(af)af.onchange=()=>{NET.fill=af.checked;renderLobby()};
 const st=$('#lbStart');if(st)st.onclick=startMulti;
}
function startMulti(){
 const ps=lobbyPeers(),mine=ps.find(p=>p.sameTab);if(!mine)return;
 const others=ps.filter(p=>!p.sameTab).slice(0,3);
 const seats=[{ctl:'local',nick:NICK,peer:mine.peer},...others.map(o=>({ctl:'remote',nick:cleanNick(o.presence&&o.presence.nick)||'무명',peer:o.peer}))];
 if(NET.fill)while(seats.length<4)seats.push({ctl:'ai'});
 if(seats.length<2)return;
 const seen=new Set();seats.forEach(s=>{if(!s.nick)return;let v=s.nick,i=2;while(seen.has(v))v=s.nick+i++;s.nick=v;seen.add(v)});
 NET.lobby=false;NET.r.presence({stage:'game'}).catch(()=>{});
 newGame({mode:'host',seats});
}

/* ---------- own-server relay (Render) : same API shape as the Claude room ---------- */
function makeRelay(){
 return {join(name){return new Promise((resolve,reject)=>{
  let es=null,me='',token='',closed=false,peers=[],resolved=false;const myPres={};
  const msgH=new Map(),peerH=new Set();
  const wrap=p=>Object.freeze({peer:p.peer,presence:Object.freeze(p.presence&&typeof p.presence==='object'?p.presence:{}),sameTab:p.peer===me,isMe:p.peer===me,kind:'viewer',guest:false,by:null,updatedAt:Date.now()});
  function setPeers(list){
   if(!Array.isArray(list))return;
   const nx=list.map(wrap),old=new Map(peers.map(p=>[p.peer,p])),nw=new Map(nx.map(p=>[p.peer,p]));
   const ch={peers:nx,joined:nx.filter(p=>!old.has(p.peer)),left:peers.filter(p=>!nw.has(p.peer)),
    updated:nx.filter(p=>old.has(p.peer)&&JSON.stringify(old.get(p.peer).presence)!==JSON.stringify(p.presence))};
   peers=nx;peerH.forEach(f=>{try{f(ch)}catch(e){console.error(e)}});
  }
  const post=(path,body)=>fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...body,room:name,token})})
   .then(r=>{if(!r.ok)throw {code:'upstream_error'}});
  function connect(){
   const q=new URLSearchParams({room:name});if(token)q.set('resume',token);
   es=new EventSource('/events?'+q);
   es.addEventListener('hello',e=>{const d=JSON.parse(e.data);me=d.peer;token=d.token;
    if(Object.keys(myPres).length)post('/presence',{presence:myPres}).catch(()=>{});
    if(!resolved){resolved=true;resolve(api)}});
   es.addEventListener('peers',e=>{try{setPeers(JSON.parse(e.data))}catch(err){}});
   es.addEventListener('msg',e=>{let d;try{d=JSON.parse(e.data)}catch(err){return}
    const hs=msgH.get(d.topic);if(!hs)return;
    const m={topic:d.topic,data:d.data,peer:d.peer,sameTab:d.peer===me,isMe:d.peer===me,kind:'viewer',guest:false,by:null};
    hs.forEach(f=>{try{f(m)}catch(err){console.error(err)}})});
   es.onerror=()=>{if(closed)return;es.close();setTimeout(()=>{if(!closed)connect()},1500)};
  }
  const api={name,
   emit:(topic,data)=>post('/send',{topic,data}).catch(()=>{}),
   on:(topic,fn)=>{if(!msgH.has(topic))msgH.set(topic,new Set());msgH.get(topic).add(fn);return()=>msgH.get(topic).delete(fn)},
   presence:patch=>{for(const k in patch){if(patch[k]===null)delete myPres[k];else myPres[k]=patch[k]}
    return token?post('/presence',{presence:myPres}).catch(()=>{}):Promise.resolve()},
   peers:()=>peers,
   onPeers:fn=>{peerH.add(fn);if(peers.length)queueMicrotask(()=>fn({peers,joined:peers,left:[],updated:[]}));return()=>peerH.delete(fn)},
   connected:()=>!!es&&es.readyState===1,
   leave:()=>{closed=true;es&&es.close();return post('/leave',{}).catch(()=>{})}};
  addEventListener('pagehide',()=>{if(!closed&&token)navigator.sendBeacon('/leave',new Blob([JSON.stringify({room:name,token})],{type:'application/json'}))});
  connect();
  setTimeout(()=>{if(!resolved){closed=true;es&&es.close();reject({code:'upstream_error'})}},10000);
 })}};
}
async function ownServer(){
 if(!/^https?:$/.test(location.protocol))return false;
 try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),3000);
  const r=await fetch('/ping',{signal:ctl.signal,cache:'no-store'});clearTimeout(tm);
  return r.ok&&(await r.text()).trim()==='pong';
 }catch(e){return false}
}
// keep a sleeping free host awake while anyone has the page open (every 4 min)
function startKeepAlive(){setInterval(()=>{fetch('/ping',{cache:'no-store'}).catch(()=>{})},4*60*1000)}

/* ---------- title screen ---------- */
const NICKS=['떠돌이','새벽 순례자','무명의 신도','늦잠꾸러기','외톨이 검사','초보 사제','길 잃은 용사'];
$('#nick').value=(()=>{try{return localStorage.getItem('q4nick')||''}catch(e){return ''}})()||rnd(NICKS);
function takeNick(){NICK=cleanNick($('#nick').value)||rnd(NICKS);$('#nick').value=NICK;try{localStorage.setItem('q4nick',NICK)}catch(e){}}
$('#btnSolo').onclick=()=>{takeNick();newGame({mode:'solo'})};
$('#btnHost').onclick=()=>{takeNick();enterRoom(genCode(),true)};
$('#btnJoin').onclick=()=>{const code=($('#code').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==4){setNote('4자리 방 코드를 입력해 주세요.');return}takeNick();enterRoom(code,false)};
$('#code').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4)});
$('#code').addEventListener('keydown',e=>{if(e.key==='Enter')$('#btnJoin').click()});
(async()=>{
 let r=null;
 if(await ownServer()){r=makeRelay();startKeepAlive()}
 else{
  for(let i=0;i<30&&!(window.claude&&window.claude.use);i++)await new Promise(z=>setTimeout(z,100));
  try{if(window.claude&&window.claude.use)r=await window.claude.use('room')}catch(e){r=null}
 }
 NET.room=r;$('#btnHost').disabled=$('#btnJoin').disabled=!r;
 setNote(r?'방을 만들면 4자리 코드가 생겨요. 친구는 이 페이지를 열고 코드를 입력하면 들어옵니다.':'함께 하기는 게임 서버나 claude.ai에서 열었을 때만 쓸 수 있어요.');
})();
